name: Python CI with uv

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "skills-ref/uv.lock"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: "skills-ref/.python-version"
    - name: Install dependencies
      working-directory: ./skills-ref
      run: uv sync
    - name: Lint with ruff
      working-directory: ./skills-ref
      run: uv run ruff check
    - name: Test with pytest
      working-directory: ./skills-ref
      run: uv run pytest
